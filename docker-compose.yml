services:
  db:
    image: postgres:14
    container_name: pg-docker
    environment:
      - DATABASE_HOST=localhost
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - $HOME/docker/volumes/postgres:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      PORT: ${SERVER_PORT}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - 'db'

  client:
    build: ./client
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - 'server'

volumes:
  db-data:
